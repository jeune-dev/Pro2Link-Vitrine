<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro2Link — Gérez vos relations commerciales B2B</title>
    <meta name="description" content="Pro2Link centralise vos fournisseurs, bons de commande, factures et paiements dans une seule plateforme B2B pensée pour les professionnels au Sénégal." />
    <meta name="theme-color" content="#0F4C81" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pro2Link" />
    <meta property="og:locale" content="fr_SN" />
    <meta property="og:title" content="Pro2Link — Gérez vos relations commerciales B2B" />
    <meta property="og:description" content="Fournisseurs, bons de commande, factures et paiements réunis dans une seule plateforme." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      // Thème choisi par l'utilisateur (préférence locale), appliqué avant le rendu.
      try {
        var t = localStorage.getItem('pl-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
      // Révélation au défilement : activée seulement si elle peut fonctionner
      // et si l'utilisateur n'a pas demandé à réduire les animations.
      if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('anim');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pro2Link nécessite JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
